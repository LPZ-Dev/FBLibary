<!DOCTYPE html>
<html lang="th" data-theme="dark" data-font-size="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#110d18" />
  <title>Fat Buds Weed Shop • Staff Wiki &amp; Knowledge Hub (คู่มือพนักงาน &amp; สกิล fbts)</title>
  <meta
    name="description"
    content="ศูนย์รวมข้อมูลจำเป็นและคู่มือปฏิบัติงานสำหรับพนักงาน Fat Buds Weed Shop Bangkok (SOP เปิด-ปิดร้าน, ระบบ POS, สคริปต์แชทลูกค้า, กฎระเบียบ 6 สาขา และสกิลแปลแชท fbts สำหรับ Gemini &amp; ChatGPT)"
  />
  <meta property="og:title" content="Fat Buds Weed Shop • Staff Wiki &amp; Knowledge Hub" />
  <meta
    property="og:description"
    content="เว็บคลังความรู้สไตล์ Notion / Wiki สำหรับทีมงาน Fat Buds รวม SOP หน้าร้าน สคริปต์แอดมิน และสกิลแปลแชท fbts"
  />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/fatbuds-logo.png" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wiki-shell">
    <!-- ==================== LEFT SIDEBAR (NOTION NAVIGATION) ==================== -->
    <aside id="wiki-sidebar" class="wiki-sidebar" aria-label="เมนูหลักคลังข้อมูลพนักงาน">
      <div class="sidebar-header">
        <div class="workspace-brand" data-nav-target="home" role="button" tabindex="0" aria-label="กลับสู่หน้าแรก Fat Buds Staff Wiki">
          <img src="assets/fatbuds-logo.png" alt="Fat Buds Logo" class="workspace-logo" width="40" height="40" />
          <div class="workspace-meta">
            <p class="workspace-title">
              <span>Fat Buds Wiki</span>
              <span class="workspace-badge">STAFF</span>
            </p>
            <p class="workspace-sub">SOP • Guides • AI Tools</p>
          </div>
        </div>

        <button id="btn-sidebar-search" type="button" class="sidebar-search-btn" data-open-search="true">
          <span class="sidebar-search-left">
            <span aria-hidden="true">🔍</span>
            <span>ค้นหาคู่มือ / สคริปต์...</span>
          </span>
          <kbd class="kbd-shortcut">⌘K</kbd>
        </button>
      </div>

      <!-- Dynamic Navigation Tree -->
      <nav id="sidebar-nav-content" class="sidebar-scroll" aria-label="หมวดหมู่คู่มือ"></nav>

      <div class="sidebar-footer">
        <span class="shop-hours-pill">
          <span class="status-dot" aria-hidden="true"></span>
          <span>10:30AM–3:00AM</span>
        </span>
        <span>6 Branches BKK</span>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- ==================== MAIN WORKSPACE AREA ==================== -->
    <div class="wiki-main-wrapper">
      <!-- Sticky Top Breadcrumb & Controls Bar -->
      <header class="wiki-topbar">
        <div class="topbar-left">
          <button
            id="btn-mobile-menu"
            type="button"
            class="mobile-menu-btn"
            aria-label="เปิดเมนูหมวดหมู่"
          >
            ☰
          </button>
          <div id="topbar-breadcrumbs" class="breadcrumbs" aria-label="เส้นทางหน้าปัจจุบัน"></div>
        </div>

        <div class="topbar-actions">
          <button
            id="btn-topbar-search"
            type="button"
            class="icon-btn"
            data-open-search="true"
            title="ค้นหาด่วน (Ctrl+K / Cmd+K)"
          >
            <span aria-hidden="true">🔍</span>
            <span class="hide-on-mobile">ค้นหา</span>
          </button>

          <button
            id="btn-pin-guide"
            type="button"
            class="icon-btn"
            hidden
            title="ปักหมุดคู่มือนี้ไว้ในเมนูซ้าย"
          >
            <span aria-hidden="true">☆</span>
            <span>ปักหมุด</span>
          </button>

          <button
            id="btn-font-toggle"
            type="button"
            class="icon-btn"
            title="ปรับขนาดตัวอักษร"
          >
            <span aria-hidden="true">🔡</span>
            <span class="hide-on-mobile">ตัวอักษร: ปกติ</span>
          </button>

          <button
            id="btn-theme-toggle"
            type="button"
            class="icon-btn"
            title="สลับโหมดมืด Purple-Gold / โหมดสว่าง"
          >
            <span aria-hidden="true">☀️</span>
            <span class="hide-on-mobile">โหมดสว่าง</span>
          </button>
        </div>
      </header>

      <!-- Main Body + Right Table of Contents Grid -->
      <div id="wiki-body-grid" class="wiki-body-grid is-home-view">
        <main id="wiki-article-container" class="wiki-article-container"></main>

        <!-- Right Sticky Table of Contents (Visible on Guide Pages) -->
        <aside id="wiki-toc-aside" class="wiki-toc-aside" aria-label="สารบัญในบทความ" hidden>
          <div class="toc-box">
            <h2 class="toc-heading">📑 สารบัญในหน้านี้</h2>
            <ul id="toc-list" class="toc-list"></ul>
          </div>

          <div class="quick-tools-card">
            <div class="toc-heading" style="margin-bottom: 4px;">⚡ เครื่องมือด่วน</div>
            <button type="button" class="quick-tool-btn" data-nav-target="fbts-skill">
              <span>✨</span>
              <span>เปิดสกิลแปลแชท fbts</span>
            </button>
            <button type="button" class="quick-tool-btn" id="btn-copy-page-link">
              <span>🔗</span>
              <span>คัดลอกลิงก์หน้านี้ส่ง LINE</span>
            </button>
            <button type="button" class="quick-tool-btn" id="btn-print-guide">
              <span>🖨️</span>
              <span>พิมพ์ / บันทึกเป็น PDF</span>
            </button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- ==================== INSTANT SEARCH MODAL (CMD+K) ==================== -->
  <div id="search-modal-backdrop" class="search-modal-backdrop" role="dialog" aria-modal="true" aria-label="ค้นหาคู่มือพนักงาน" hidden>
    <div class="search-modal">
      <div class="search-input-bar">
        <span aria-hidden="true" style="font-size: 18px;">🔍</span>
        <input
          id="search-modal-input"
          type="search"
          class="search-input"
          placeholder="พิมพ์ค้นหาคู่มือ เช่น POS, เปิดร้าน, สคริปต์ลูกค้า, fbts, สาขา..."
          autocomplete="off"
        />
        <button type="button" class="icon-btn" data-close-search="true" style="padding: 4px 8px; font-size: 11.5px;">
          ESC
        </button>
      </div>
      <div id="search-modal-results" class="search-results"></div>
      <div class="search-modal-footer">
        <span>ใช้ปุ่ม <strong>↑ ↓</strong> เพื่อเลื่อน และกด <strong>Enter</strong> เพื่อเปิดอ่าน</span>
        <span>Fat Buds Staff Wiki</span>
      </div>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <div id="toast-inner" class="toast-inner">แจ้งเตือน</div>
  </div>

  <script src="wiki-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
